name: test
on: [push, pull_request, workflow_dispatch]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway default keychain
        run: |
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
      - run: python3 -I tests/test_store.py
        env: { EXPECT_BACKEND: macOS Keychain }
      - run: python3 -I tests/test_form_pty.py
      - run: python3 -I tests/test_setup.py
      - run: python3 -I tests/test_app.py
      - run: npm test
        working-directory: npm

  linux-secret-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11
      - name: Store tests inside a D-Bus session with an unlocked keyring
        run: |
          dbus-run-session -- sh -c '
            printf "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            EXPECT_BACKEND="Secret Service" python3 -I tests/test_store.py &&
            python3 -I tests/test_form_pty.py &&
            python3 -I tests/test_setup.py &&
            python3 -I tests/test_app.py'

  linux-file-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tests/test_store.py
        env: { EXPECT_BACKEND: file 0600 }
      - run: python3 -I tests/test_form_pty.py
      - run: python3 -I tests/test_setup.py
      - run: python3 -I tests/test_app.py
      - run: sh -n install.sh
      - name: npm package matches the plugin version and packs with the engine
        run: |
          node --check npm/cli.js
          plugin=$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml)
          npm=$(node -p 'require("./npm/package.json").version')
          [ "$plugin" = "$npm" ] || { echo "herdr-plugin.toml $plugin != npm/package.json $npm"; exit 1; }
          cmp LICENSE npm/LICENSE
          node npm/stage.js
          (cd npm && npm pack --dry-run --json) > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.argv[1])[0].files.map((f) => f.path);
            const want = ["cli.js", ...require("./npm/stage.js").FILES.map((f) => "engine/" + f)];
            const missing = want.filter((f) => !files.includes(f));
            console.log(files.join("\n"));
            if (missing.length) { console.error("missing from the package:", missing); process.exit(1); }
          ' "$RUNNER_TEMP/pack.json"
      - run: npm test
        working-directory: npm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -I tests/test_store.py
        env: { EXPECT_BACKEND: Windows Credential Manager }
      - run: python -I tests/test_setup.py
      - run: python -I tests/test_app.py
      - run: npm test
        working-directory: npm
      - name: Launcher resolves Python
        shell: cmd
        run: bin\herdr-secret.cmd list
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $tokens = $null; $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errs)
          if ($errs) { $errs; exit 1 }
